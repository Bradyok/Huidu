[package]
name = "hdset"
version = "0.1.0"
edition = "2021"
description = "Rust reproduction of the Huidu HDSet V4.0.16.0 LED hardware configuration tool"
authors = ["Huidu Reverse Engineering Project"]

[[bin]]
name = "hdset"
path = "src/main.rs"

[lib]
name = "hdset"
path = "src/lib.rs"

[features]
# Enable egui GUI (requires native windowing)
gui = ["dep:eframe", "dep:egui", "dep:image", "dep:rfd"]

[[bin]]
name = "hdset-gui"
path = "src/bin/hdset_gui.rs"
required-features = ["gui"]

[dependencies]
huidu-protocol = { path = "../huidu-protocol" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
uuid = { version = "1", features = ["v4"] }
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "1"
bytes = "1"
byteorder = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"

# Optional GUI dependencies
eframe  = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow"] }
egui    = { version = "0.31", optional = true }
image   = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
rfd     = { version = "0.15", optional = true }

# Serial port support for direct USB/serial connection to send cards
# Only available on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serialport = "4"
